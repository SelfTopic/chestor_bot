services:

  postgres:
    image: "postgres:16"
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_DB=${POSTGRES_DATABASE}

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - 5050:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app_network

  bot:
    build: .
    tty: true
    env_file:
      - .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - PYTHONUNBUFFERED=1
      - PORT=8999
      - POSTGRES_HOSTNAME=postgres 
      - DB_HOST=postgres
    ports:
      - "127.0.0.1:${BOT_EXTERNAL_PORT:-8999}:8999"
    volumes:
      - .:/app 
    working_dir: /app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - app_network

  migrations:
    build: .
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOSTNAME=postgres
    command: ["poetry", "run", "alembic", "upgrade", "head"]
    networks:
      - app_network

  db_backup:
    image: prodrigestivill/postgres-backup-local:16
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=90
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres
    networks:
      - app_network

  rclone_backup:
    image: rclone/rclone
    restart: always
    volumes:
      - ./backups:/data:ro
      - ./rclone.conf:/rclone.conf:ro  
    entrypoint: /bin/sh -c "while true; do rclone sync /data gdrive:my_project_backups -L --config /rclone.conf -v; sleep 3600; done"
    depends_on:
      - db_backup
    networks:
      - app_network

  userbot_parser:
    build: .
    command: ["poetry", "run", "python", "-m", "src.userbot_parser.src.main"]
    env_file:
      - src/userbot_parser/.env
    volumes:
      - .:/app
    restart: "no"
    networks:
      - app_network

  lottery_video_rotator:
    # Отдельный процесс, НЕ внутри бота - рендер (moviepy/ffmpeg) синхронный
    # и блокирующий, гонять его в event loop'е бота нельзя (тот же класс
    # бага, что уже чинили с нарезкой видео в anime_router). Раз в 30 минут
    # заменяет несколько самых старых лотерейных роликов на цвет свежими
    # (см. LotteryGenerator.rotate_all) - тот же паттерн цикла, что уже
    # используется у rclone_backup.
    build: .
    entrypoint: /bin/sh -c "while true; do poetry run python -m src.bot.utils.rotate_lottery_videos; sleep 1800; done"
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped

        

volumes:
  postgres_data:
  pgadmin_data:
networks:
  app_network:
    driver: bridge
