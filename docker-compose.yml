# Один образ приложения на проект (у прода chestor_bot-app, у стенда chestor_test-app):
# собирает его только migrations, остальные сервисы берут готовый и никогда не
# скачивают. Раньше каждый сервис с build: . экспортировал свою копию на ~2 ГБ.
x-app-image: &app-image
  image: ${COMPOSE_PROJECT_NAME}-app
  pull_policy: never

services:

  postgres:
    image: "postgres:16"
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_DB=${POSTGRES_DATABASE}

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - 5050:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app_network

  bot:
    <<: *app-image
    tty: true
    env_file:
      - .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - PYTHONUNBUFFERED=1
      - PORT=8999
      - POSTGRES_HOSTNAME=postgres 
      - DB_HOST=postgres
    ports:
      - "127.0.0.1:${BOT_EXTERNAL_PORT:-8999}:8999"
    volumes:
      - .:/app 
    working_dir: /app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - app_network

  # Порт на selfrotgram (ветка feature/port-to-selfrotgram), только для тестового
  # стенда. profiles: обычный `docker compose up` (прод) его не запускает, а
  # `docker compose -p chestor_test up selfrot_bot` включает профиль сам.
  selfrot_bot:
    <<: *app-image
    profiles: ["selfrot"]
    tty: true
    command: ["poetry", "run", "python", "-m", "src.selfrot_bot"]
    env_file:
      - .env
    environment:
      # Отдельная переменная, а не BOT_TOKEN: порт не запустится на токене прода.
      - SELFROT_BOT_TOKEN=${SELFROT_BOT_TOKEN:-}
      # ENV из .env прода здесь не действует: по умолчанию стенд — polling.
      # SELFROT_ENV=PROD — вебхук, тогда нужны SELFROT_WEBHOOK_URL и
      # SELFROT_WEBHOOK_SECRET (см. .env.example).
      - ENV=${SELFROT_ENV:-DEV}
      - SELFROT_WEBHOOK_URL=${SELFROT_WEBHOOK_URL:-}
      - SELFROT_WEBHOOK_SECRET=${SELFROT_WEBHOOK_SECRET:-}
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOSTNAME=postgres
      - DB_HOST=postgres
    # Для вебхука: nginx отдаёт https://chestor.site/webhook… на 127.0.0.1:8999, как
    # прод-боту. Пока прод-бот запущен, порт занят: SELFROT_EXTERNAL_PORT сдвигает стенд.
    ports:
      - "127.0.0.1:${SELFROT_EXTERNAL_PORT:-8999}:8999"
    volumes:
      - .:/app
    working_dir: /app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - app_network

  migrations:
    <<: *app-image
    build: .
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOSTNAME=postgres
    command: ["poetry", "run", "alembic", "upgrade", "head"]
    networks:
      - app_network

  db_backup:
    image: prodrigestivill/postgres-backup-local:16
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=90
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres
    networks:
      - app_network

  rclone_backup:
    image: rclone/rclone
    restart: always
    volumes:
      - ./backups:/data:ro
      - ./rclone.conf:/rclone.conf:ro  
    entrypoint: /bin/sh -c "while true; do rclone sync /data gdrive:my_project_backups -L --config /rclone.conf -v; sleep 3600; done"
    depends_on:
      - db_backup
    networks:
      - app_network

  userbot_parser:
    # Базой не пользуется, поэтому от migrations не зависит: запуск без образа —
    # сначала `docker compose build migrations`.
    <<: *app-image
    command: ["poetry", "run", "python", "-m", "src.userbot_parser.src.main"]
    env_file:
      - src/userbot_parser/.env
    volumes:
      - .:/app 
    restart: "no"
    networks:
      - app_network

        

volumes:
  postgres_data:
  pgadmin_data:
networks:
  app_network:
    driver: bridge
