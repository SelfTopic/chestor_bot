name: CI

on:
  push:
  pull_request:

# Новый пуш в ту же ветку отменяет прогон, который ещё идёт.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ruff, pyright, selfrot check, pytest
    runs-on: ubuntu-latest
    env:
      # src.config требует эти настройки при импорте; значения фиктивные, как в tests/conftest.py.
      BOT_TOKEN: "123456:TEST"
      POSTGRES_DATABASE: test
      POSTGRES_USERNAME: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOSTNAME: localhost
      PGADMIN_DEFAULT_EMAIL: test@example.org
      PGADMIN_DEFAULT_PASSWORD: test
      GHOUL_QUIZ_API_KEY: test
    steps:
      - uses: actions/checkout@v4

      - run: pipx install poetry==2.3.4

      # Python как в образе бота (Dockerfile), а не как на машине разработчика.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: poetry install --no-interaction --no-root

      - run: poetry run pip install pyright==1.1.414

      - run: poetry run ruff check src/bot tests
      - run: poetry run pyright src/bot tests
      - run: poetry run selfrot check --strict src.bot.__main__:Dispatcher
      # Postgres для тестов conftest.py поднимает сам через Docker раннера.
      - run: poetry run python -m pytest tests -n auto

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: chestor-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Инструменты, без которых бот запускается, но не качает видео, песни и не шазамит.
      - run: |
          docker run --rm --entrypoint sh chestor-bot:ci -c '
            /opt/media-tools/bin/yt-dlp --version &&
            /opt/media-tools/bin/gallery-dl --version &&
            ffmpeg -version | head -1 &&
            poetry run python -c "import shazamio, selfrot; print(\"ok\")"
          '
