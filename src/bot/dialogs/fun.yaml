fun:
  nobody:
    - 'Пока некого выбирать — в этом чате ещё никто не написал боту.'
    - 'Выбирать не из кого: боту тут ещё никто не писал. Одиночество, блять.'
  pick:
    result:
      - '🎲 Выбор пал на: {choice}'
      - '🎲 Тут без вариантов: {choice}'
      - '🎲 Очевидно же — {choice}'
      - '🎲 Бросил кости, выпало: {choice}'
    too_few:
      - 'Нужно минимум 2 варианта: бот выбери пицца или суши или бургер'
      - 'Из одного варианта выбирать? Гений. Пример: бот выбери пицца или суши'
    too_many: 'Слишком много вариантов (максимум {max_items}). Определись уже сам.'
    too_long: 'Один из вариантов слишком длинный. Короче, Склифосовский.'
  who:
    - 'По моим расчётам {question} {mention}'
    - 'Тут и думать нечего: {question} {mention}'
    - 'Инфа сотка: {question} {mention}'
    - 'Все знают, что {question} {mention}'
  random_participant:
    - '🎲 Выбор пал на {mention}!'
    - '🎲 Сегодня крайний — {mention}.'
    - '🎲 Барабан крутится… {mention}!'
  number: 🎲 {number}
  calculator:
    division_by_zero:
      - 'Лучше себя на ноль подели.'
      - 'На ноль не делят. Даже гули.'
      - 'Ноль в знаменателе, а мозг — в числителе. Ах да, его нет.'
    too_big:
      - 'Получилось пизда как дохуя, я не буду это говно считать.'
      - 'Бля эта цифра даже в соо не влезет.'
      - 'Столько даже твоя мамка не весит.'
  search:
    usage: 'Что искать? Пиши после «бот найди»: бот найди что такое кагуне'
    cooldown:
      - 'Не так часто. Следующий поиск через {seconds} с.'
      - 'Погоди {seconds} с, я ещё от прошлого поиска не отошёл.'
    limit_reached:
      - 'На сегодня поиски кончились. Приходи завтра.'
      - 'Лимит поиска на сегодня выбран. Завтра продолжим.'
    unavailable: 'Поиск сейчас выключен.'
    failed:
      - 'Ничего не нашёл, поиск не ответил. Попробуй позже.'
      - 'Поиск молчит. Спроси чуть позже.'
  edits:
    empty: 'Эдитов пока нет: каналы ещё не разобраны.'
  quote:
    result: '💬 {character}: «{text}»'
    not_found:
      - 'Не знаю такого персонажа. Или цитат от него пока нет.'
      - 'Хз кто это. Может, цитат от него пока не завезли.'
