anime:
  usage: |-
    Укажи сезон и серию.

    Пример:
    /anime 1 1

    Также могу дать отрывок:
    /anime 1 12 18:37 18:47
  bad_format: |-
    ❌ Неверный формат команды.

    Пример для отрывка:
    /anime 1 12 18:37 18:47
    или
    /anime  12 18:37 18:47 gif
    чтобы получить отрывок сразу гифкой
  bad_start: |-
    ❌ Неверный начальный таймкод.

    Пример: 18:37
  bad_end: |-
    ❌ Неверный конечный таймкод.

    Пример: 18:47
  end_before_start: '❌ Конец отрывка раньше начала? Время назад не ходит.'
  not_found: '❌ Сезона {season} серии {episode} нет. Может, сам снимешь?'
  busy: '⏳ У тебя уже нарезается отрывок. Дождись, нетерпеливый.'
  episode_caption: 🎬 Сезон {season}. Серия {episode}
  cutting: |-
    ⏳ Начинаю нарезку видео...
    Сезон {season}, серия {episode}
    Отрывок: {start} - {end}

    Это может занять несколько секунд.
  cut_caption: 🎬 Сезон {season}. Серия {episode}. Отрывок с {start} до {end}
  video: |-
    Video
    {caption}
  gif: |-
    Gif
    {caption}
  timeout: '❌ Нарезка слишком долгая. Выбери кусок поменьше или попробуй позже.'
  cancelled: '❌ Нарезка отменена.'
  queue_full: '❌ Сейчас все режут аниме. Попробуй чуть позже.'
  failed: '❌ Произошла ошибка при нарезке видео: {error}'
