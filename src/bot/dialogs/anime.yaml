anime:
  usage: |-
    Укажи сезон и серию.

    Пример:
    /anime 1 1

    Также могу дать отрывок:
    /anime 1 12 18:37 18:47
  bad_format: |-
    ❌ Неверный формат команды.

    Пример для отрывка:
    /anime 1 12 18:37 18:47
    или
    /anime  12 18:37 18:47 gif
    чтобы получить отрывок сразу гифкой
  bad_start: |-
    ❌ Неверный начальный таймкод.

    Пример: 18:37
  bad_end: |-
    ❌ Неверный конечный таймкод.

    Пример: 18:47
  end_before_start: ❌ Конечный таймкод должен быть больше начального.
  not_found: ❌ Видео сезона {season} серии {episode} не найдено.
  busy: ⏳ У тебя уже есть нарезка в процессе. Дождись её завершения.
  episode_caption: 🎬 Сезон {season}. Серия {episode}
  cutting: |-
    ⏳ Начинаю нарезку видео...
    Сезон {season}, серия {episode}
    Отрывок: {start} - {end}

    Это может занять несколько секунд.
  cut_caption: 🎬 Сезон {season}. Серия {episode}. Отрывок с {start} до {end}
  video: |-
    Video
    {caption}
  gif: |-
    Gif
    {caption}
  timeout: |-
    ❌ Превышено время ожидания нарезки видео.
    Попробуйте выбрать меньший фрагмент или повторите позже.
  cancelled: ❌ Нарезка видео была отменена.
  queue_full: ❌ Сейчас слишком много запросов на нарезку. Попробуй чуть позже.
  failed: '❌ Произошла ошибка при нарезке видео: {error}'
