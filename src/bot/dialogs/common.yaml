start: Привет, {name}! Я тематический телеграм бот посвященный фандому аниме Токийский Гуль. Чтобы узнать список команд или ознакомиться с лором - /help
help: |-
  Список на статью с командами: https://t.me/CheStorCommands

  Список на статью с лором: Временно отсутствует
rules:
  missing: В этом чате правила отсутствуют. Чтобы указать новые правила используйте команду 'новые правила'
balance: '{name}, твой баланс составляет {balance} CheSton.'
profile:
  unknown_race: Ээээ.. Пока неясно что это такое.
  card: |-
    ❕Твой профиль:

    👤 Имя:{name}
    ❓ Раса: {race}
    💲 Баланс: {balance}

    Для открытия расового профиля используйте команду /race_profile или 'распрофиль'
errors:
  unexpected: 'Ошибка: {error}'
  user_not_found: '❌ Пользователь не найден: {query}'
  username_not_found: 'Ошибка: Пользователь с username {username} не найден'
  chat_not_found: 'Ошибка: Чат не найден в базе данных'
  media_not_found: 'Ошибка: Медиа не найдено в базе данных'
  not_enough_money: Ты успокойся нахуй. Ты ебаная бомжиха. На твоем балансе не хватает {money} CheSton для покупки.
tops:
  balance:
    text: |-
      Топ {count} самых богатих гулий:

      {rows}
    row: '{place}. {name} - {balance} CheSton'
    bad_count: Топ нужно указывать положительной цифрой в диапазоне 1-50
rp:
  created: Установлена Role-Play команда {command} с действием {action}
  deleted: Role-Play команда {command} удалена
  empty: В этом чате нет Role-Play команд. Используйте /set_rp
  list: |-
    Список всех Role-Play команд чата:

    {rows}
  row: '{place}. {command} - {action}'
  media_usage: |-
    Используйте
    /set_rp
    <команда>
    <действие>
  set_usage: |-
    Ошибка: Используйте как /set_rp
    <команда>
    <действие>
    например:
    /set_rp
    погладить
    погладила(-а) по головке
  delete_usage: 'Ошибка: не указаны аргументы для удаления. используйте /del_rp <command>'
  not_found: 'Ошибка: Такой Role-Play команды не существует'
  limit_reached: 'Ошибка: RP command limit reached ({limit})'
transfer:
  ask: |-
    Перевести {amount} CheSton's пользователю {receiver}?

    Выбери именно кнопку «{confirm}» — остальные отменяют перевод.
  ask_again: |-
    Последнее подтверждение: перевести {amount} CheSton's? Это нельзя отменить.

    Выбери именно кнопку «{confirm}» — остальные отменяют перевод.
  done: ✅ Переведено {amount} CheSton's.
  cancelled: Перевод отменён.
  reply_usage: 'Укажи сумму перевода. Пример: /transfer 500 (или «перевести 500», «подать 500», «кинуть 500»)'
  usage: |-
    Использование:
    /transfer <сумма> — в ответ на сообщение получателя
    /transfer <id или @username> <сумма>

    Команду можно вызывать и так: перевести, подать, кинуть.
    Пример: /transfer @username 500 (или «кинуть @username 500»)
  buttons:
    confirm: подтвердить
    decline: не подтвердить
    surely_decline: точно не подтвердить
    confirm_decline: подтвердить что не подтверждаю
  errors:
    failed: ❌ Перевод не выполнен
    amount_out_of_range: ❌ Сумма перевода должна быть от {min_amount} до {max_amount}
    self_transfer: ❌ Нельзя перевести деньги самому себе
    sender_missing: ❌ Отправитель не найден
    sender_too_new: ❌ Переводы доступны только аккаунтам старше {days} дн.
    insufficient_balance: ❌ Недостаточно средств для перевода
    receiver_missing: ❌ Получатель не найден
    receiver_vanished: ❌ Получатель не найден, перевод отменён
    receiver_limit: ❌ Этот аккаунт уже получил слишком много переводов за последние сутки
lottery:
  usage: '❌ Неверный формат команды. Используйте: депнуть <цвет> <ставка>'
  failed: ❌ Произошла ошибка при обработке вашей ставки
  bet_out_of_range: Сумма ставки должна быть от {min_bet} до {max_bet}
  not_enough_money: Недостаточно денег для такой ставки
  player_missing: Пользователь не найден
  unknown_color: 'Неизвестный цвет ''{color}''. Используйте: {colors}'
  win: |-
    🎰 Депнул на {chosen_color}!

    🎯 Выиграл! Победный цвет был {winning_color}!
    💰 Выигрыш: {earned} CheSton (ставка {bet} × {multiplier})
    💵 Баланс: {balance} CheSton
  lose: |-
    🎰 Депнул на {chosen_color}!

    ❌ Проиграл! Победный цвет был {winning_color}!
    💸 Проигрыш: {bet} CheSton
    💵 Баланс: {balance} CheSton
