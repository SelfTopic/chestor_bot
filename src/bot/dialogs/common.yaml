  not_found: 'Ошибка: Такой Role-Play команды не существует'
  limit_reached: 'Ошибка: RP command limit reached ({limit})'
transfer:
  ask: |-
    Перевести {amount} CheSton's пользователю {receiver}?

    Выбери именно кнопку «{confirm}» — остальные отменяют перевод.
  ask_again: |-
    Последнее подтверждение: перевести {amount} CheSton's? Это нельзя отменить.

    Выбери именно кнопку «{confirm}» — остальные отменяют перевод.
  done:
    - '✅ Переведено {amount} CheSton''s.'
    - '✅ Ушло {amount} CheSton''s. Надеюсь, не на наркоту.'
    - '✅ Переведено {amount} CheSton''s. Щедрый, сука.'
  cancelled:
    - 'Перевод отменён.'
    - 'Передумал? Правильно, жадность — это хорошо.'
    - 'Отбой, деньги остались при тебе.'
  reply_usage: 'Укажи сумму перевода. Пример: /transfer 500 (или «перевести 500», «подать 500», «кинуть 500»)'
  usage: |-
    Использование:
    /transfer <сумма> — в ответ на сообщение получателя
    /transfer <id или @username> <сумма>

    Команду можно вызывать и так: перевести, подать, кинуть.
    Пример: /transfer @username 500 (или «кинуть @username 500»)
  buttons:
    confirm: подтвердить
    decline: не подтвердить
    surely_decline: точно не подтвердить
    confirm_decline: подтвердить что не подтверждаю
  errors:
    failed: ❌ Перевод не выполнен
    amount_out_of_range: '❌ Переводить можно от {min_amount} до {max_amount} CheSton.'
    self_transfer:
      - '❌ Переводить самому себе? Хитро, но нет.'
      - '❌ Нельзя перевести деньги самому себе, шизик.'
    sender_missing: ❌ Отправитель не найден
    sender_too_new: '❌ Переводы — только аккаунтам старше {days} дн. Подрасти, малой.'
    insufficient_balance:
      - '❌ Денег на перевод нет, бомжара.'
      - '❌ Недостаточно средств для перевода. Сам ещё нищий.'
    receiver_missing: ❌ Получатель не найден
    receiver_vanished: ❌ Получатель не найден, перевод отменён
    receiver_limit: '❌ Этому аккаунту уже накидали переводов за сутки. Хватит его спонсировать.'
lottery:
  usage: '🎰 Пиши так: депнуть <цвет> <ставка>. Например: депнуть красный 500'
  failed: '❌ Ставка сломалась. Попробуй ещё раз.'
  bet_out_of_range:
    - '🎰 Ставка — от {min_bet} до {max_bet} CheSton. Не больше, не меньше.'
    - '🎰 Ставь от {min_bet} до {max_bet}, умник.'
  not_enough_money:
    - '💸 На такую ставку у тебя денег нет, бомжара.'
    - '💸 Ставишь больше, чем есть? Казино так не работает.'
    - '💸 Сначала заработай, потом депай, лудик.'
  player_missing: Пользователь не найден
  unknown_color:
    - '🎰 Какой нахуй «{color}»? Цвета: {colors}.'
    - '🎰 Цвета «{color}» нет. Выбирай: {colors}.'
  win:
    - |-
      🎰 Депнул на {chosen_color}!

      🎯 Выиграл! Выпал {winning_color}!
      💸 Выигрыш: +{earned} CheSton (ставка {bet} × {multiplier})
      💵 Баланс: {balance} CheSton
    - |-
      🎰 Депнул на {chosen_color}!

      🎯 Повезло, сука! Выпал {winning_color}!
      💸 Выигрыш: +{earned} CheSton (ставка {bet} × {multiplier})
      💵 Баланс: {balance} CheSton
    - |-
      🎰 Депнул на {chosen_color}!

      🎯 Казино в минусе, ты в плюсе. Выпал {winning_color}!
      💸 Выигрыш: +{earned} CheSton (ставка {bet} × {multiplier})
      💵 Баланс: {balance} CheSton
  lose:
    - |-
      🎰 Депнул на {chosen_color}!

      ❌ Проиграл! Выпал {winning_color}.
      💸 Проигрыш: {bet} CheSton
      💵 Баланс: {balance} CheSton
    - |-
      🎰 Депнул на {chosen_color}!

      ❌ Казино всегда в плюсе. Выпал {winning_color}.
      💸 Проигрыш: {bet} CheSton
      💵 Баланс: {balance} CheSton
    - |-
      🎰 Депнул на {chosen_color}!

      ❌ Лудоман, выпал {winning_color}. Минус деньги, плюс опыт.
      💸 Проигрыш: {bet} CheSton
      💵 Баланс: {balance} CheSton
