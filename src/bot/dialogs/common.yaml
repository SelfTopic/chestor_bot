start:
  - 'Привет, {name}! Я бот по «Токийскому гулю»: тут жрут людей, ломают пальцы и дерутся кагуне. Команды и лор — /help'
  - 'О, свежее мясо. {name}, добро пожаловать. Я бот по «Токийскому гулю». Что тут можно делать — /help'
  - '{name}, ты в Токио, где людей едят. Список команд — /help. Не благодари.'
help: |-
  📖 Все команды: https://t.me/CheStorCommands

  📜 Лор: временно отсутствует
banned:
  notice: '🚫 Вы заблокированы ({term}). Причина: {reason}'
  until: до {date} UTC
  forever: навсегда
  no_reason: причина не указана
rules:
  missing:
    - '📜 Правил нет — тут анархия. Админ может задать их командой «новые правила».'
    - '📜 В этом чате правил нет, делай что хочешь. Задать их: «новые правила».'
balance:
  - '💵 {name}, на счету {balance} CheSton.'
  - '💵 {name}, твой баланс: {balance} CheSton. Трать с умом, лудик.'
  - '💵 {name}, в кармане {balance} CheSton. Пересчитай, если не веришь.'
profile:
  unknown_race: Ээээ.. Пока неясно что это такое.
  card: |-
    ❕ Твой профиль:

    👤 Имя: {name}
    ❓ Раса: {race}
    💵 Баланс: {balance}

    Расовый профиль — /race_profile или «распрофиль»
errors:
  unexpected: 'Ошибка: {error}'
  cannot_process: Невозможно обработать запрос
  user_not_found: '❌ Пользователь не найден: {query}'
  username_not_found: 'Ошибка: Пользователь с username {username} не найден'
  chat_not_found: 'Ошибка: Чат не найден в базе данных'
  ghoul_not_found: 'Ошибка: Ghoul not found'
  media_not_found: 'Ошибка: Медиа не найдено в базе данных'
  quiz:
    email_missing: 'Ошибка: Квиз: не задан GHOUL_QUIZ_EMAIL'
    session_missing: 'Ошибка: Квиз: нет сохранённой сессии для {email}, войди через ghoul-quiz-register'
  chat_text_length:
    rules: 'Ошибка: Кол-во символов в правилах не может быть меньше 1 и больше 4000 символов.'
    welcome: 'Ошибка: Кол-во символов в приветственном сообщении не может быть меньше 1 и больше 4000 символов.'
    goodbye: 'Ошибка: Кол-во символов в прощальном сообщении не может быть меньше 1 и больше 4000 символов.'
  not_enough_money:
    - '💸 Ты успокойся нахуй. Ты ебаная бомжиха. Не хватает {money} CheSton.'
    - '💸 Бомжара, тебе не хватает {money} CheSton. Иди щёлкай пальцами.'
    - '💸 Денег нет, но ты держись. Не хватает {money} CheSton.'
    - '💸 Нищеброд, не хватает {money} CheSton.'
tops:
  balance:
    message: |-
      🏆 Топ {count} самых богатых гулей:

      {rows}
    row: '{place}. {name} - {balance} CheSton'
    bad_count:
      - '🔢 Топ — это число от 1 до 50, гений.'
      - '🔢 Цифрой, блять. От 1 до 50.'
rp:
  created: '✅ Готово: теперь «{command}» — это «{action}».'
  deleted: '🗑 RP-команда «{command}» удалена.'
  empty: 'В этом чате нет RP-команд. Добавь: /set_rp'
  list: |-
    📜 RP-команды чата:

    {rows}
  row: '{place}. {command} - {action}'
  media_usage: |-
    Используйте
    /set_rp
    <команда>
    <действие>
  set_usage: |-
    Ошибка: Используйте как /set_rp
    <команда>
    <действие>
    например:
    /set_rp
    погладить
    погладила(-а) по головке
