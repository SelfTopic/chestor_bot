kagune:
  guide:
    general_title: 📖 Kagune basics
    general: |-
      The kakuhou is an organ in a ghoul's body that controls RC cells: regeneration, body enhancement and kagune outside the body. Its location defines each type's fighting style.

      🔸 Ukaku (shoulders): RC flows to the brain and arms - high speed, frequent light hits. Downside - low stamina, the monotony is easy to wait out.

      🔸 Koukaku (shoulder blades): RC strengthens the back and arm muscles - a powerful physical hit. Downside - low speed, an agile enemy dodges and counterattacks.

      🔸 Rinkaku (lower back): RC spreads evenly through the body - high stamina and regeneration. Almost no obvious weaknesses.

      🔸 Bikaku (tailbone): RC concentrates in the torso and legs - a bit of every boost at once, an all-rounder without a clear downside.

      How it affects damage: every hit is a coin flip "physical / kagune" - the first hit of a fight is always physical, then the chance of a physical hit drops by 10 p.p. for every physical hit dealt (the fight gradually slides into kagune hits). Kagune damage is usually higher - it's based on strength AND kagune strength together, physical only on strength.

      Defense: a raised kagune blocks 45-75% of a physical attack, and against an enemy kagune hit 10-20% (if your kagune strength is not lower than theirs) or 0%. Without a raised kagune, the bare body blocks 10-20% of physical hits (if your health is not lower than the attacker's) and doesn't block kagune hits at all. The chance to raise your kagune in time for a given hit depends on dexterity and speed - 50/50 with equal stats.
    table_title: ♦️ How kagune types affect stats
    column_type: Type
    table_notes: |-
      ★ - the type's priority stat: if several unlocked types touch the same stat, the "owner" (★) wins, otherwise the smallest multiplier applies (the stacking rule, see BATTLE_DESIGN.md).

      Kagune strength (the sum of all unlocked types' strength) is NOT multiplied by the kagune type itself - only by hunger (a rising stat) and kakuja.
  info: |-
    📖 The kakuhou is the organ that controls RC cells (regeneration, body enhancement, kagune). Ukaku (shoulders) - speed, weak stamina. Koukaku (shoulder blades) - hitting power, low speed. Rinkaku (lower back) - stamina and regeneration. Bikaku (tailbone) - a bit of everything.

    Every hit is a coin flip "physical/kagune": the first hit of a fight is always physical, then the chance of a physical hit drops by 10 p.p. for every physical hit dealt. Kagune damage is usually higher than physical.

    A kagune defense blocks 45-75% of a physical attack and 10-20% of an enemy kagune attack (if your kagune strength is not lower). Without a raised kagune - 10-20% of physical (if your health is not lower), 0% of kagune.

    ♦️ How kagune types affect stats (multiplier to the matching stat):

    🔸 Ukaku: speed ×1.8
    🔸 Koukaku: strength ×1.6, speed ×1.3
    🔸 Rinkaku: dexterity ×1.3, regeneration ×1.8, speed ×1.5, health ×1.5
    🔸 Bikaku: strength ×1.5, dexterity ×1.4, regeneration ×1.4, speed ×1.4, health ×1.4

    If several unlocked types touch the same stat, the stat's "owner" wins, otherwise the smallest multiplier applies.

    Kagune strength (the sum of all unlocked types' strength) is NOT multiplied by the kagune type itself - only by hunger and kakuja.
