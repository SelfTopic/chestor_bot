transfer:
  ask: |-
    Send {amount} CheSton to {receiver}?

    Press exactly "{confirm}": every other button cancels the transfer.
  ask_again: |-
    Last confirmation: send {amount} CheSton? This can't be undone.

    Press exactly "{confirm}": every other button cancels the transfer.
  done:
    - '✅ Sent {amount} CheSton.'
    - '✅ {amount} CheSton gone. Hope it''s not for drugs.'
    - '✅ Sent {amount} CheSton. Generous bastard.'
  cancelled:
    - 'Transfer cancelled.'
    - 'Changed your mind? Good, greed is good.'
    - 'Called off, you keep your money.'
  reply_usage: 'Say how much to send. Example: send 500 (or pay 500, /transfer 500)'
  usage: |-
    Usage:
    send <amount>, as a reply to the receiver's message
    send <id or @username> <amount>

    You can also write pay or /transfer instead of send.
    Example: send @username 500
  buttons:
    confirm: confirm
    decline: don't confirm
    surely_decline: definitely don't confirm
    confirm_decline: confirm that I don't confirm
  errors:
    failed: ❌ Transfer failed
    amount_out_of_range: '❌ You can send from {min_amount} to {max_amount} CheSton.'
    self_transfer:
      - '❌ Send money to yourself? Clever, but no.'
      - '❌ You can''t send money to yourself, psycho.'
    bot:
      - '❌ The bot doesn''t need money, it runs on electricity.'
      - '❌ Send it to a bot? The money would just burn.'
    not_a_person:
      - '❌ That''s a Telegram service account (a channel or an anonymous admin): the money would be lost.'
      - '❌ There''s no person behind that message. Who are you paying, a channel?'
    spouse:
      - '❌ You share a family account: the money is already shared.'
      - '❌ Paying your spouse? The money is already in the family account.'
    sender_missing: ❌ Sender not found
    sender_too_new: '❌ Transfers are only for accounts older than {days} days. Grow up, kid.'
    insufficient_balance:
      - '❌ No money for that transfer, hobo.'
      - '❌ Insufficient funds. You''re broke yourself.'
    receiver_missing: ❌ Receiver not found
    receiver_vanished: ❌ Receiver not found, transfer cancelled
    receiver_limit: '❌ This account already got enough transfers today. Stop sponsoring them.'
