start:
  - |-
    Hey {name}! I'm a Tokyo Ghoul bot: people get eaten, fingers get snapped, kagune fight. Commands: /help

    {hint}
  - |-
    Oh, fresh meat. Welcome, {name}. I'm a Tokyo Ghoul bot. What you can do here: /help

    {hint}
  - |-
    {name}, welcome to Tokyo, where people get eaten. Command list: /help. Don't thank me.

    {hint}
help:
  sections: |-
    # 📖 CheStor help

    {rows}

    Details on any command: `/help <command>`, e.g. `/help snap`, `/help duel`, `/help coffee`.
  not_found: 'Nothing in the help about "{query}". Section list: /help with no words.'
  did_you_mean: 'Nothing about "{query}". Maybe you meant:'
  more: 📖 Whole section
rich:
  usage: 'Reply /rich to an .md file and I''ll build a rich message from it: headings, lists, tables, quotes, code, <details> spoilers.'
  too_long: 'Too long: a rich message fits up to {limit} characters.'
  not_utf8: 'Can''t read it: the file must be UTF-8.'
  empty: 'The file is empty, nothing to build.'
  download_failed: 'Couldn''t download the file, try again.'
  rejected: 'Telegram rejected the markup: {error}'
banned:
