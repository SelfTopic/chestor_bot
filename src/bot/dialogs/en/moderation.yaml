    log_unwarned: '🧽 CCG report, "{chat}": a mark wiped off {name} (id {id}), {count}/{limit} left. Wiped by: {moderator}'
    log_warn_penalty_muted: '⛓ CCG report, "{chat}": {name} (id {id}) collected {limit}/{limit}, Cochlea {term}. Given by: {moderator}'
    log_warn_penalty_banned: '🚷 CCG report, "{chat}": {name} (id {id}) collected {limit}/{limit}, thrown out {term}. Given by: {moderator}'
    log_warn_penalty_kicked: '🥾 CCG report, "{chat}": {name} (id {id}) collected {limit}/{limit}, out the door. Given by: {moderator}'
    log_warn_limit: '⚙️ CCG report, "{chat}": we pack at mark number {limit}. Ordered by: {moderator}'
    log_warn_penalty: '⚙️ CCG report, "{chat}": all the marks now get {penalty}. Ordered by: {moderator}'
    log_warn_expiry: '⚙️ CCG report, "{chat}": marks expire {term}. Ordered by: {moderator}'
    mute_expired:
