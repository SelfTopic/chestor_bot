    warn_usage: |-
      Who goes on the list? Reply to a message or give a @username/id, the charge is optional:
      /warn flood
      /warn @username spam
    unwarn_usage: 'Whose mark are we wiping? Reply /unwarn to a message or give a @username/id: /unwarn @username'
    warns_usage: 'Files: your own with /warns; someone else''s (admins only) by reply or by @username/id: /warns @username'
    warn_limit_set: '⚙️ Got it. I pack at mark number {limit}.'
    warn_limit_current: |-
      ⚙️ I pack at mark number {limit}.
      To change: /warn_limit 5 (from {min} to {max}).
    warn_limit_out_of_range: 'Marks go from {min} to {max}, the CCG isn''t made of rubber.'
    warn_penalty_set: '⚙️ Got it. Whoever collects all the marks gets {penalty}.'
    warn_penalty_current: |-
      ⚙️ Whoever collects all the marks gets {penalty}.
