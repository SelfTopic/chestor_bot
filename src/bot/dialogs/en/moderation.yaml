    log_warned_for: '⚠️ "{chat}" · warn {count}/{limit}: {name} (id {id}). Moderator: {moderator}. Reason: {reason}'
    log_unwarned: '✅ "{chat}" · warn removed, {count}/{limit} left: {name} (id {id}). Moderator: {moderator}'
