    log_mute_default: '⚙️ CCG report, "{chat}": with no term we now pack {term}. Ordered by: {moderator}'
    log_ban_default: '⚙️ CCG report, "{chat}": with no term we now throw out {term}. Ordered by: {moderator}'
    log_voice: '⚙️ CCG report, "{chat}": politeness is over, rough moderation. Ordered by: {moderator}'
    log_unlinked: '⚙️ CCG report: the "{chat}" HQ here is disbanded. Ordered by: {moderator}'
    user_not_found: 'Who the hell is {query}? The CCG has never heard of them. Reply to their message or give an id.'
    anonymous: Take off the mask, anonymous. Nobody gets packed from around the corner here.
    moderator_lacks_right: 'Your arms are too short. You need the {right} right.'
    bot_lacks_right: 'I wasn''t given the {right} right. Without it I can''t pack anyone here.'
    target_is_admin: '{name} is an admin. The CCG doesn''t touch its own.'
    term_out_of_range: 'Cochlea doesn''t work like that: from {min} to {max} or "forever".'
    feature_disabled: 'The CCG doesn''t do that here: {feature} is turned off in /moderation.'
    log_feature: '⚙️ CCG report, "{chat}": {feature}: {state}. Ordered by: {moderator}'
    warned:
