moderation:
  term:
    forever: forever
    limited: 'for {duration}'
    days: '{count} d'
    hours: '{count} h'
    minutes: '{count} min'
    seconds: '{count} s'
    after: 'in {duration}'
    never: never
  penalty:
    mute: mute
    ban: ban
    kick: kick
    timed: '{penalty} {term}'
  feature:
    mute: mute
    ban: ban
    kick: kick
    warns: warns
    notices: term end notices
  right:
    restrict_members: '"Ban users"'
    change_info: '"Change group info"'
  menu:
    title: '⚙️ Moderation of "{chat}"'
    column_setting: Setting
    column_value: Value
    'on': 'on'
    'off': 'off'
    mute: Mute
    ban: Ban
    kick: Kick
    warns: Warns
    notices: Term end notices
    mute_default: Mute with no term
    ban_default: Ban with no term
    warn_limit: Warn limit
    warn_penalty: Penalty at the limit
    warn_expiry: Warns expire
    voice: Voice
    admin_chat: Admin chat
    voice_neutral: neutral
    voice_rough: rough
    admin_chat_none: not linked
    hint: 'An admin with the "Change group info" right can change these with the buttons. The owner links the admin chat: /set_admin_chat'
    button_on: '✅ {name}'
    button_off: '❌ {name}'
    button_value: '{name}: {value}'
    button_prev: ◀
    button_next: ▶
    button_minus: −
    button_plus: +
    use_arrows: 'Change the value with the side buttons.'
    no_right: 'You need the {right} right for this.'
