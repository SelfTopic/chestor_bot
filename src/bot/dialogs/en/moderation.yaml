  neutral:
    muted: '🔇 {name} is muted {term}.'
    muted_for: '🔇 {name} is muted {term}. Reason: {reason}'
    unmuted: '🔊 {name} can write again.'
    not_muted: '{name} isn''t muted anyway.'
    banned: '🚫 {name} is banned {term}.'
    banned_for: '🚫 {name} is banned {term}. Reason: {reason}'
    unbanned: '✅ Ban lifted: {name} can come back via the link.'
    not_banned: '{name} isn''t banned anyway.'
    kicked: '👢 {name} is removed from the chat. They can come back via the link.'
    kicked_for: '👢 {name} is removed from the chat. Reason: {reason}'
    target_absent: '{name} isn''t in the chat.'
    mute_usage: |-
      Mute by replying to a message or by @username/id, term and reason are optional:
      /mute 30m flood
      /mute @username 1h spam
      No term means the default term, "forever" means no end.
    unmute_usage: 'Unmute by replying to a message or by @username/id: /unmute @username'
    ban_usage: |-
      Ban by replying to a message or by @username/id, term and reason are optional:
      /ban 1d ads
      /ban @username forever spam
      No term means the default term.
    unban_usage: 'Unban by replying to a message or by @username/id: /unban @username'
    kick_usage: |-
      Kick by replying to a message or by @username/id, reason is optional:
      /kick flood
      /kick @username
    mute_default_set: '⚙️ A mute with no term now lasts {term}.'
    mute_default_current: |-
      ⚙️ A mute with no term lasts {term}.
      To change: /mute_default 1h, "forever" means no end.
    ban_default_set: '⚙️ A ban with no term now lasts {term}.'
    ban_default_current: |-
      ⚙️ A ban with no term lasts {term}.
      To change: /ban_default 1d, "forever" means no end.
    voice_set: ⚙️ The moderation voice is now neutral.
    voice_current: |-
      ⚙️ The moderation voice is neutral.
      To change: /moderation_voice rough
    admin_chat_none: |-
      No admin chat linked.
      To link: /set_admin_chat @admin_chat (or its id), then confirm in that chat.
    admin_chat_current: |-
      The admin chat is "{chat}".
      To unlink: /set_admin_chat off
    admin_chat_requested: |-
      Request: make "{chat}" the admin chat of this chat.
      To confirm, the owner of this chat writes in "{chat}":
      {command}
    admin_chat_linked: 'Done: moderation actions and settings changes of "{chat}" will come here.'
    admin_chat_unlinked: Admin chat "{chat}" unlinked.
    admin_chat_not_linked: No admin chat is linked anyway.
    admin_chat_not_found: 'Couldn''t find the group {query}. Give the @username or id of a group the bot is in.'
    admin_chat_self: A chat can't be its own admin chat.
    admin_chat_taken: This chat is already the admin chat of another chat.
    owner_only: Only the chat owner can link and unlink the admin chat.
    log_muted: '🔇 "{chat}" · mute {term}: {name} (id {id}). Moderator: {moderator}'
    log_muted_for: '🔇 "{chat}" · mute {term}: {name} (id {id}). Moderator: {moderator}. Reason: {reason}'
    log_unmuted: '🔊 "{chat}" · unmute: {name} (id {id}). Moderator: {moderator}'
    log_banned: '🚫 "{chat}" · ban {term}: {name} (id {id}). Moderator: {moderator}'
    log_banned_for: '🚫 "{chat}" · ban {term}: {name} (id {id}). Moderator: {moderator}. Reason: {reason}'
    log_unbanned: '✅ "{chat}" · unban: {name} (id {id}). Moderator: {moderator}'
    log_kicked: '👢 "{chat}" · kick: {name} (id {id}). Moderator: {moderator}'
    log_kicked_for: '👢 "{chat}" · kick: {name} (id {id}). Moderator: {moderator}. Reason: {reason}'
    log_mute_default: '⚙️ "{chat}" · a mute with no term is now {term}. Moderator: {moderator}'
    log_ban_default: '⚙️ "{chat}" · a ban with no term is now {term}. Moderator: {moderator}'
    log_voice: '⚙️ "{chat}" · moderation voice: neutral. Moderator: {moderator}'
    log_unlinked: '⚙️ Chat "{chat}" unlinked from this admin chat. Moderator: {moderator}'
    user_not_found: 'Couldn''t find {query}. Reply to that person''s message or give their id.'
    anonymous: 'Moderation through the bot isn''t available to an anonymous admin: the bot can''t see who''s writing.'
    moderator_lacks_right: 'You need the {right} right for this.'
    bot_lacks_right: 'The bot lacks the {right} right. Grant it in the admin settings.'
    target_is_admin: '{name} is an admin and can''t be punished.'
    term_out_of_range: 'The term is from {min} to {max} or "forever".'
    feature_disabled: 'This is turned off in the chat moderation settings: {feature}. To turn it on: /moderation.'
    log_feature: '⚙️ "{chat}" · {feature}: {state}. Moderator: {moderator}'
    warned: '⚠️ {name} gets a warn: {count} of {limit}.'
    warned_for: '⚠️ {name} gets a warn: {count} of {limit}. Reason: {reason}'
    warn_penalty_muted: '🔇 {name} reaches {limit} of {limit} warns and is muted {term}.'
    warn_penalty_banned: '🚫 {name} reaches {limit} of {limit} warns and is banned {term}.'
    warn_penalty_kicked: '👢 {name} reaches {limit} of {limit} warns and is removed from the chat.'
    unwarned: '✅ {name}: warn removed, {count} of {limit} left.'
    no_warnings: '{name}: no warns, nothing to remove.'
    warns_none: '{name}: no active warns.'
    warns_list: |-
      ⚠️ {name}: {count} of {limit} warns.
      {items}
    warns_item: '• {reason}, expires {left}'
    warns_item_forever: '• {reason}, never expires'
    no_reason: no reason
    warn_usage: |-
      Warn by replying to a message or by @username/id, reason is optional:
      /warn flood
      /warn @username spam
    unwarn_usage: 'Remove a warn by replying to a message or by @username/id: /unwarn @username'
    warns_usage: 'Warns: your own with /warns; someone else''s (admins only) by reply or by @username/id: /warns @username'
    warn_limit_set: '⚙️ The penalty now comes at warn number {limit}.'
    warn_limit_current: |-
      ⚙️ The penalty comes at warn number {limit}.
      To change: /warn_limit 5 (from {min} to {max}).
    warn_limit_out_of_range: 'The warn limit is from {min} to {max}.'
    warn_penalty_set: '⚙️ At the warn limit it''s now {penalty}.'
    warn_penalty_current: |-
      ⚙️ At the warn limit it's {penalty}.
      To change: /warn_action ban 1d (mute, ban or kick; no term keeps the previous term).
    warn_expiry_set: '⚙️ Warns now expire {term}.'
    warn_expiry_current: |-
      ⚙️ Warns expire {term}.
      To change: /warn_expiry 3d, "forever" means they never expire.
