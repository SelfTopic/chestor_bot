    log_banned_for: '🚷 CCG report, "{chat}": {name} (id {id}) thrown out {term}. Exiled by: {moderator}. Charge: {reason}'
    log_unbanned: '🚪 CCG report, "{chat}": {name} (id {id}) can come in again. Forgiven by: {moderator}'
    log_kicked: '🥾 CCG report, "{chat}": {name} (id {id}) is out the door. Kicked by: {moderator}'
