    log_warn_penalty_kicked: '👢 "{chat}" · {limit}/{limit} warns, kick: {name} (id {id}). Moderator: {moderator}'
    log_warn_limit: '⚙️ "{chat}" · the penalty now comes at warn number {limit}. Moderator: {moderator}'
    log_warn_penalty: '⚙️ "{chat}" · at the warn limit it''s now {penalty}. Moderator: {moderator}'
    log_warn_expiry: '⚙️ "{chat}" · warns expire {term}. Moderator: {moderator}'
    mute_expired: '🔊 {name}, your mute is over: you can write again.'
    warn_expired: '🕊 {name}, a warn expired. {count} of {limit} left.'
    log_mute_expired: '🔊 "{chat}" · mute expired: {name} (id {id})'
    log_ban_expired: '✅ "{chat}" · ban expired: {name} (id {id}) can come back via the link'
    log_warn_expired: '🕊 "{chat}" · warn expired, {count}/{limit} left: {name} (id {id})'
  rough:
    muted:
      - '⛓ The CCG is packing: {name} goes to Cochlea {term}. Sit there and think.'
      - '⛓ {name} is sent to Cochlea {term}. Mouth shut.'
    muted_for:
      - '⛓ The CCG is packing: {name} goes to Cochlea {term}. Charge: {reason}'
      - '⛓ {name} is sent to Cochlea {term}. What for: {reason}'
    unmuted:
      - '🔓 {name} walks out of Cochlea. Keep quiet.'
      - '🔓 {name} is free. Don''t celebrate, the CCG is watching.'
    not_muted: '{name} is already free, who am I supposed to release?'
    banned:
      - '🚷 {name} is thrown out of the 20th ward {term}. Forget the way back.'
      - '🚷 CCG mark: {name} doesn''t set foot here {term}.'
    banned_for:
      - '🚷 {name} is thrown out of the 20th ward {term}. Charge: {reason}'
      - '🚷 CCG mark: {name} doesn''t set foot here {term}. What for: {reason}'
    unbanned: '🚪 The CCG mark is removed: {name} can come back via the link.'
    not_banned: '{name} isn''t banned anyway, who am I supposed to forgive?'
    kicked:
      - '🥾 {name} flies out the door. If they want, they can come back via the link.'
      - '🥾 A kick in the ass: {name} is out the door.'
    kicked_for:
      - '🥾 {name} flies out the door. Charge: {reason}'
      - '🥾 A kick in the ass: {name} is out the door. What for: {reason}'
    target_absent: '{name} isn''t here, nobody to kick.'
    mute_usage: |-
      Who are we packing? Reply to a message or give a @username/id, a term and a charge:
      /mute 30m flood
      /mute @username 1h spam
      No term means the default term, "forever" means for good.
    unmute_usage: 'Who are we releasing? Reply /unmute to a message or give a @username/id: /unmute @username'
    ban_usage: |-
      Who are we kicking out? Reply to a message or give a @username/id, a term and a charge:
      /ban 1d ads
      /ban @username forever spam
      No term means the default term.
    unban_usage: 'Who are we forgiving? Reply /unban to a message or give a @username/id: /unban @username'
    kick_usage: |-
      Who are we kicking? Reply to a message or give a @username/id, the charge is optional:
      /kick flood
      /kick @username
    mute_default_set: '⚙️ Got it. Anyone with no term sits in Cochlea {term}.'
    mute_default_current: |-
      ⚙️ With no term I pack them into Cochlea {term}.
      To change: /mute_default 1h, "forever" means for good.
    ban_default_set: '⚙️ Got it. Anyone with no term is thrown out {term}.'
    ban_default_current: |-
      ⚙️ With no term I throw them out {term}.
      To change: /ban_default 1d, "forever" means for good.
    voice_set:
      - ⚙️ That's it, the CCG starts its shift. Rough from now on.
      - ⚙️ Politeness is over. Rough from here on.
    voice_current: |-
      ⚙️ I'm rough right now. And don't ask me nicely.
      To soften: /moderation_voice neutral
    admin_chat_none: |-
      You have no HQ, nowhere to report.
      To set one up: /set_admin_chat @admin_chat (or its id), then confirm in that chat.
    admin_chat_current: |-
      CCG reports go to "{chat}".
      To disband the HQ: /set_admin_chat off
    admin_chat_requested: |-
      Want an HQ in "{chat}"? Let the owner of this chat confirm there:
      {command}
    admin_chat_linked: 'HQ deployed. CCG reports and every change in "{chat}" will come here.'
    admin_chat_unlinked: The HQ in "{chat}" is disbanded, no more reports.
    admin_chat_not_linked: There's no HQ anyway, nothing to disband.
    admin_chat_not_found: 'Group {query}? Never heard of it. Give me a @username or id, and I have to be in it.'
    admin_chat_self: An HQ inside itself? Not happening.
    admin_chat_taken: This chat is already the HQ of another chat. Find your own.
    owner_only: Only the chat owner sets up and disbands the HQ.
