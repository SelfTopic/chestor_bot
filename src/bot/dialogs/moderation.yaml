moderation:
  term:
    forever: навсегда
    limited: 'на {duration}'
    days: '{count} д'
    hours: '{count} ч'
    minutes: '{count} мин'
    seconds: '{count} с'
  right:
    restrict_members: «Блокировка пользователей»
  neutral:
    muted: '🔇 {name} в муте {term}.'
    muted_for: '🔇 {name} в муте {term}. Причина: {reason}'
    unmuted: '🔊 {name} снова может писать.'
    not_muted: '{name} и так не в муте.'
    mute_usage: |-
      Мут — ответом на сообщение или по @username/id, срок и причина по желанию:
      мут 30м флуд
      /mute @username 1 час 30 мин спам
      Без срока — срок по умолчанию, «навсегда» — без срока.
    unmute_usage: 'Размут — ответом на сообщение («размут») или по @username/id: /unmute @username'
    user_not_found: 'Не нашёл {query}. Ответь на сообщение этого человека или укажи его id.'
    anonymous: Анонимному админу модерация через бота недоступна — бот не видит, кто пишет.
    moderator_lacks_right: 'Для этого нужно право {right}.'
    bot_lacks_right: 'Боту не хватает права {right}. Выдайте его в настройках администраторов.'
    target_is_admin: '{name} — администратор, его наказать нельзя.'
    term_out_of_range: 'Срок — от {min} до {max} или «навсегда».'
  rough:
    muted:
      - '⛓ CCG упаковала {name} в Кокурию {term}. Посиди, подумай.'
      - '⛓ {name} едет в Кокурию {term}. Рот закрыт.'
    muted_for:
      - '⛓ CCG упаковала {name} в Кокурию {term}. За что: {reason}'
      - '⛓ {name} едет в Кокурию {term}. Статья: {reason}'
    unmuted:
      - '🔓 {name} выпустили из Кокурии. Веди себя тихо.'
      - '🔓 {name} на воле. Не радуйся, CCG следит.'
    not_muted: '{name} и так на воле, кого выпускать-то?'
    mute_usage: |-
      Кого пакуем? Ответь на сообщение или дай @username/id, срок и статью:
      мут 30м флуд
      /mute @username 1 час 30 мин спам
      Без срока — срок по умолчанию, «навсегда» — с концами.
    unmute_usage: 'Кого выпускаем? Ответь «размут» на сообщение или дай @username/id: /unmute @username'
    user_not_found: 'Кто такой {query}? CCG про такого не слышала. Ответь на его сообщение или дай id.'
    anonymous: Сними маску, анонимус. Из-за угла тут не пакуют.
    moderator_lacks_right: 'Руки коротки. Нужно право {right}.'
    bot_lacks_right: 'Мне не дали право {right}. Без него я тут никого не упакую.'
    target_is_admin: '{name} — админ. Своих CCG не пакует.'
    term_out_of_range: 'Кокурия так не работает: от {min} до {max} или «навсегда».'
