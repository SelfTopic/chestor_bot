      /mute @username 1 час 30 мин спам
      Без срока — срок по умолчанию, «навсегда» — без срока.
    unmute_usage: 'Размут — ответом на сообщение («размут») или по @username/id: /unmute @username'
    ban_usage: |-
      Бан — ответом на сообщение или по @username/id, срок и причина по желанию:
      бан 1д реклама
      /ban @username навсегда спам
      Без срока — срок по умолчанию.
    unban_usage: 'Разбан — ответом на сообщение («разбан») или по @username/id: /unban @username'
    kick_usage: |-
      Кик — ответом на сообщение или по @username/id, причина по желанию:
      кик флуд
      /kick @username
    mute_default_set: '⚙️ Мут без срока теперь даётся {term}.'
    mute_default_current: |-
      ⚙️ Мут без срока даётся {term}.
      Поменять: «мут дефолт 1ч» или /mute_default 1h, «навсегда» — без срока.
    ban_default_set: '⚙️ Бан без срока теперь даётся {term}.'
