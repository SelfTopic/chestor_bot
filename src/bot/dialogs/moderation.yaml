moderation:
  term:
    forever: навсегда
    limited: 'на {duration}'
    days: '{count} д'
    hours: '{count} ч'
    minutes: '{count} мин'
    seconds: '{count} с'
  right:
    restrict_members: «Блокировка пользователей»
    change_info: «Изменение профиля группы»
  neutral:
    muted: '🔇 {name} в муте {term}.'
    muted_for: '🔇 {name} в муте {term}. Причина: {reason}'
    unmuted: '🔊 {name} снова может писать.'
    not_muted: '{name} и так не в муте.'
    banned: '🚫 {name} получает бан {term}.'
    banned_for: '🚫 {name} получает бан {term}. Причина: {reason}'
    unbanned: '✅ Бан снят: {name} может вернуться по ссылке.'
    not_banned: '{name} и так не в бане.'
    kicked: '👢 {name} удаляется из чата. Вернуться можно по ссылке.'
    kicked_for: '👢 {name} удаляется из чата. Причина: {reason}'
    target_absent: '{name} нет в чате.'
    mute_usage: |-
      Мут — ответом на сообщение или по @username/id, срок и причина по желанию:
      мут 30м флуд
      /mute @username 1 час 30 мин спам
      Без срока — срок по умолчанию, «навсегда» — без срока.
    unmute_usage: 'Размут — ответом на сообщение («размут») или по @username/id: /unmute @username'
    ban_usage: |-
      Бан — ответом на сообщение или по @username/id, срок и причина по желанию:
      бан 1д реклама
      /ban @username навсегда спам
      Без срока — срок по умолчанию.
    unban_usage: 'Разбан — ответом на сообщение («разбан») или по @username/id: /unban @username'
    kick_usage: |-
      Кик — ответом на сообщение или по @username/id, причина по желанию:
      кик флуд
      /kick @username
    mute_default_set: '⚙️ Мут без срока теперь даётся {term}.'
    mute_default_current: |-
      ⚙️ Мут без срока даётся {term}.
      Поменять: «мут дефолт 1ч» или /mute_default 1h, «навсегда» — без срока.
    ban_default_set: '⚙️ Бан без срока теперь даётся {term}.'
    ban_default_current: |-
      ⚙️ Бан без срока даётся {term}.
      Поменять: «бан дефолт 1д» или /ban_default 1d, «навсегда» — без срока.
    voice_set: ⚙️ Голос модерации теперь нейтральный.
    voice_current: |-
      ⚙️ Голос модерации — нейтральный.
      Поменять: «Стиль модерации грубый» или /moderation_voice rough
    user_not_found: 'Не нашёл {query}. Ответь на сообщение этого человека или укажи его id.'
    anonymous: Анонимному админу модерация через бота недоступна — бот не видит, кто пишет.
    moderator_lacks_right: 'Для этого нужно право {right}.'
    bot_lacks_right: 'Боту не хватает права {right}. Выдайте его в настройках администраторов.'
    target_is_admin: '{name} — администратор, его наказать нельзя.'
    term_out_of_range: 'Срок — от {min} до {max} или «навсегда».'
  rough:
    muted:
      - '⛓ CCG пакует: {name} едет в Кокурию {term}. Посиди, подумай.'
      - '⛓ {name} отправляется в Кокурию {term}. Рот закрыт.'
    muted_for:
      - '⛓ CCG пакует: {name} едет в Кокурию {term}. Статья: {reason}'
      - '⛓ {name} отправляется в Кокурию {term}. За что: {reason}'
    unmuted:
      - '🔓 {name} выходит из Кокурии. Веди себя тихо.'
      - '🔓 {name} на воле. Не радуйся, CCG следит.'
    not_muted: '{name} и так на воле, кого выпускать-то?'
    banned:
      - '🚷 {name} вылетает из 20-го района {term}. Дорогу сюда забудь.'
      - '🚷 Метка CCG: {name} сюда не заходит {term}.'
    banned_for:
      - '🚷 {name} вылетает из 20-го района {term}. Статья: {reason}'
      - '🚷 Метка CCG: {name} сюда не заходит {term}. За что: {reason}'
    unbanned: '🚪 Метку CCG сняли: {name} может вернуться по ссылке.'
    not_banned: '{name} и так не в бане, кого прощать-то?'
    kicked:
      - '🥾 {name} летит за дверь. Захочет — вернётся по ссылке.'
      - '🥾 Пинок под зад: {name} за дверью.'
    kicked_for:
      - '🥾 {name} летит за дверь. Статья: {reason}'
      - '🥾 Пинок под зад: {name} за дверью. За что: {reason}'
    target_absent: '{name} тут нет, пинать некого.'
    mute_usage: |-
      Кого пакуем? Ответь на сообщение или дай @username/id, срок и статью:
      мут 30м флуд
      /mute @username 1 час 30 мин спам
      Без срока — срок по умолчанию, «навсегда» — с концами.
    unmute_usage: 'Кого выпускаем? Ответь «размут» на сообщение или дай @username/id: /unmute @username'
    ban_usage: |-
      Кого гоним? Ответь на сообщение или дай @username/id, срок и статью:
      бан 1д реклама
      /ban @username навсегда спам
      Без срока — срок по умолчанию.
    unban_usage: 'Кого прощаем? Ответь «разбан» на сообщение или дай @username/id: /unban @username'
    kick_usage: |-
      Кого пинаем? Ответь на сообщение или дай @username/id, статья по желанию:
      кик флуд
      /kick @username
    mute_default_set: '⚙️ Понял. Кто без срока — сидит в Кокурии {term}.'
    mute_default_current: |-
      ⚙️ Без срока пакую в Кокурию {term}.
      Поменять: «мут дефолт 1ч» или /mute_default 1h, «навсегда» — с концами.
    ban_default_set: '⚙️ Понял. Кто без срока — вылетает {term}.'
    ban_default_current: |-
      ⚙️ Без срока выгоняю {term}.
      Поменять: «бан дефолт 1д» или /ban_default 1d, «навсегда» — с концами.
    voice_set:
      - ⚙️ Ну всё, CCG выходит на смену. Теперь по-грубому.
      - ⚙️ Вежливость кончилась. Дальше по-грубому.
    voice_current: |-
      ⚙️ Сейчас я грубый. И не проси по-хорошему.
      Смягчить: «Стиль модерации нейтральный» или /moderation_voice neutral
    user_not_found: 'Кто такой {query}? CCG про такого не слышала. Ответь на его сообщение или дай id.'
    anonymous: Сними маску, анонимус. Из-за угла тут не пакуют.
    moderator_lacks_right: 'Руки коротки. Нужно право {right}.'
    bot_lacks_right: 'Мне не дали право {right}. Без него я тут никого не упакую.'
    target_is_admin: '{name} — админ. Своих CCG не трогает.'
    term_out_of_range: 'Кокурия так не работает: от {min} до {max} или «навсегда».'
