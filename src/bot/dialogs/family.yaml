marriage:
  usage: 'Позови в семью реплаем на сообщение — «брак» или «свадьба», либо «брак @username» / «брак <id>».'
  user_not_found: 'Не нашёл такого: {target}'
  refusals:
    self:
      - 'Жениться на себе? Сильно, но нет.'
      - 'Себя ты и так любишь, семья для этого не нужна.'
    not_registered: 'Этот человек ни разу не писал боту — сначала пусть напишет хоть что-нибудь.'
    same_family: 'Вы и так в одной семье.'
    target_married:
      - 'Этот человек уже в другой семье. Пусть сначала разведётся.'
      - 'Занято. У человека уже есть семья — уводить будешь через развод.'
    already_proposed: 'Ты уже позвал этого человека, ждите ответа.'
    not_enough_money: 'Предложение стоит {price} CheSton, у тебя столько нет. Иди щёлкай.'
  ask: |-
    💍 {proposer}, предложение {target} вступить в семью стоит {price} CheSton.
    Деньги не вернутся, если откажут или за час согласятся не все. Ещё {price} заплатит {target}, когда брак заключится.
  invite: |-
    💍 {proposer} зовёт {target} в семью!
    Брак заключится, если за час согласятся все:
    {rows}
  family_hint: 'Семья {proposer} подтверждает в личке бота — кнопка ниже.'
  row_confirmed: '✅ {name}'
  row_waiting: '⏳ {name}'
  married:
    - |-
      💍 Свершилось! {target} теперь в семье.
      Семья: {members}
    - |-
      💍 Горько! {target} вступает в семью.
      Семья: {members}
  failed:
    target_taken: '💔 Свадьбы не будет: {target} уже вступил(а) в другую семью.'
    family_changed: '💔 Свадьбы не будет: семья {proposer} изменилась, пока ждали.'
    target_broke: '💔 Свадьбы не будет: у {target} не нашлось {price} CheSton.'
  declined:
    - '💔 {name} против. Свадьбы не будет, {price} CheSton {proposer} сгорели.'
    - '💔 {name} сказал(а) «нет». {proposer} остаётся без свадьбы и без {price} CheSton.'
  expired:
    - '⌛ Час прошёл, согласились не все. Свадьбы не будет, {price} CheSton {proposer} сгорели.'
    - '⌛ Не дождались. {proposer} остаётся без свадьбы и без {price} CheSton.'
  consent:
    accepted: 'Принято, ждём остальных.'
    married: 'Горько! 💍'
    declined: 'Отказ принят.'
    stale: 'Предложение уже неактуально.'
    not_invited: 'Тебя тут не спрашивают.'
    already: 'Ты уже согласился(ась).'
    not_enough_money: 'Чтобы согласиться, нужно {price} CheSton на счету.'
  not_your_button:
    - 'Это не твоя кнопка.'
    - 'Руки убрал, это не тебе.'
  family_vote: |-
    💍 {proposer} зовёт {target} в вашу семью.
    Брак заключится, только если согласятся все, а одно «против» его отменит. Ты согласен(на)?
  family_voted: '✅ Твоё согласие учтено.'
  family_declined: '❌ Ты против — свадьбы не будет.'
  link_stale: 'Это предложение уже неактуально.'
  link_not_family: 'Это предложение не тебе: подтверждают только члены семьи.'
  buttons:
    pay: '💍 Сделать предложение ({price})'
    proposer: '💍 Подтверждаю (зовущий)'
    target: '💍 Согласен(на)'
    family: '💍 Подтвердить в личке'
    family_vote: '💍 Согласен(на)'
    decline: '❌ Отказаться'
    family_decline: '❌ Против'
family:
  single:
    - 'Ты не в семье. Позови кого-нибудь: «брак» реплаем на сообщение.'
    - 'Семьи нет. Одиночество — тоже выбор, но «брак» реплаем всё исправит.'
  view: |-
    👨‍👩‍👧 Твоя семья
    💵 Счёт семьи: {balance} CheSton

    {rows}
  row: '{name} — с {since}'
  top_name: 'семья {members}'
divorce:
  not_married: 'Ты не в семье, разводиться не с кем.'
  ask: '💔 Уйти из семьи? Уходишь ни с чем: все деньги остаются семье.'
  button: '💔 Развестись'
  done: '💔 {name} уходит из семьи. Деньги остались семье.'
  dissolved: '💔 {name} уходит из семьи, и семья распалась. {heir} остаётся с {amount} CheSton.'
  stale: 'Уже неактуально.'
