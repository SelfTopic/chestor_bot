kagune:
  guide:
    general_title: 📖 Общая информация о кагуне
    general: |-
      Какухо - орган в теле гуля, управляющий RC-клетками: регенерация, усиление тела и кагуне вне тела. Его расположение определяет боевой стиль каждого типа.

      🔸 Укаку (плечи): приток RC в мозг и руки - высокая скорость, частые лёгкие удары. Минус - низкая выносливость, однообразие легко пережидается.

      🔸 Коукаку (лопатки): RC усиливает мышцы спины и рук - мощный физический удар. Минус - низкая скорость, ловкий противник уворачивается и контратакует.

      🔸 Ринкаку (поясница): RC равномерно расходится по телу - высокая выносливость и регенерация. Явных слабостей почти нет.

      🔸 Бикаку (копчик): RC концентрируется в корпусе и ногах - понемногу всех усилений сразу, универсал без выраженного минуса.

      Как это влияет на урон: каждый удар решается монеткой «физический / кагуне» - первый удар боя всегда физический, дальше шанс физического падает на 10 п.п. за каждый нанесённый физический удар (бой постепенно скатывается в удары кагуне). Урон кагуне обычно выше - считается от силы И силы кагуне вместе, физический - только от силы.

      Защита: если кагуне поднято - блокирует 45-75% физической атаки, а против чужого удара кагуне - 10-20% (если своя сила кагуне не меньше чужой) либо 0%. Без поднятого кагуне - голое тело блокирует физику на 10-20% (если здоровье не меньше, чем у атакующего) и вообще не блокирует удары кагуне. Шанс успеть поднять кагуне под конкретный удар зависит от ловкости и скорости - при равных статах 50/50.
    table_title: ♦️ Влияние типов кагуне на статы
    table_notes: |-
      ★ - приоритетный стат типа: если открыто несколько типов, трогающих один стат, побеждает «хозяин» (★), иначе берётся наименьший из множителей (правило стаков, см. BATTLE_DESIGN.md).

      Сила кагуне (сумма силы всех открытых типов) сама по себе НЕ множится типом кагуне - только голодом (растущий стат) и какуджей.
  info: |-
    📖 Какухо - орган, управляющий RC-клетками (регенерация, усиление тела, кагуне). Укаку (плечи) - скорость, слабая выносливость. Коукаку (лопатки) - сила удара, низкая скорость. Ринкаку (поясница) - выносливость и регенерация. Бикаку (копчик) - понемногу всего сразу.

    Каждый удар - монетка "физический/кагуне": первый удар боя всегда физический, дальше шанс физического падает на 10 п.п. за каждый нанесённый физический удар. Урон кагуне обычно выше физического.

    Защита кагуне блокирует 45-75% физической атаки и 10-20% чужой атаки кагуне (если своя сила кагуне не меньше). Без поднятого кагуне - 10-20% от физики (если здоровье не меньше), от кагуне - 0%.

    ♦️ Влияние типов кагуне на статы (множитель к соответствующему стату):

    🔸 Укаку: скорость ×1.8
    🔸 Коукаку: сила ×1.6, скорость ×1.3
    🔸 Ринкаку: ловкость ×1.3, регенерация ×1.8, скорость ×1.5, здоровье ×1.5
    🔸 Бикаку: сила ×1.5, ловкость ×1.4, регенерация ×1.4, скорость ×1.4, здоровье ×1.4

    Если открыто несколько типов, трогающих один стат - побеждает "хозяин" стата, иначе применяется наименьший из множителей.

    Сила кагуне (сумма силы всех открытых типов) сама по себе НЕ множится типом кагуне - только голодом и какуджей.
