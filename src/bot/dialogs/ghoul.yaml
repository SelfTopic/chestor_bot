ghoul:
  new: |-
    Рождение нового гуля - всегда для кого-то счастье, а для кого то горе. Твоё же появление кажется принесёт только горе.
    Тебя {name} зовут, да? ну что же. Отныне ты гуль. И у тебя есть кагуне. Его тип: {kagune_type}
  reborn: |-
    🐣 Вау, отныне ты гуль... Снова. Новый тип кагуне: {kagune_type}.

    Всё остальное - с чистого листа.
  profile: |-
    👤 Профиль гуля {danger_rank} ранга {name}

    📈 Уровень: {level}
    👁‍🗨 Типы кагуне:
      🔸 {kagune_type}

    💪 Сила кагуне: {strength_kagune}
    👌Щелкнул пальцем: {snap_count}
    ♦️RC-клеток: {rc_count}

    🤟 Сила: {strength}
    🏃‍♀️ Скорость: {speed}
    🤾‍♀️ Ловкость: {dexterity}
    ❤️ Текущее/Максимальное HP: {health}/{max_health}
    ❣️ Сила регенерации: {regeneration}
    ⚡ Боевая мощь: {power}
    ☕️ Выпито кофе: {coffee_count}
    🥩 Съедено людей: {eat_humans}
    🥩 Съедено гулей: {eat_ghouls}
    ⚔️ Всего боёв: {total_battles} ({wins} побед / {losses} поражений)
    👹 Боёв с мобами: {mob_battles} ({mob_wins} побед / {mob_losses} поражений)
    🧬 Какуджа: {is_kakuja}
  dead_profile: |-
    💀 {name} мёртв.

    Уровень: мёртв
    Голод: мёртв
    RC-клеток: мёртв
    Кагуне: мёртв
    Статы: мёртв

    Чтобы начать заново - напиши "растить кагуне".
  dead: Да ты сдох, что ты собираешься использовать?.
kagune:
  info: |-
    📖 Какухо - орган, управляющий RC-клетками (регенерация, усиление тела, кагуне). Укаку (плечи) - скорость, слабая выносливость. Коукаку (лопатки) - сила удара, низкая скорость. Ринкаку (поясница) - выносливость и регенерация. Бикаку (копчик) - понемногу всего сразу.

    Каждый удар - монетка "физический/кагуне": первый удар боя всегда физический, дальше шанс физического падает на 10 п.п. за каждый нанесённый физический удар. Урон кагуне обычно выше физического.

    Защита кагуне блокирует 45-75% физической атаки и 10-20% чужой атаки кагуне (если своя сила кагуне не меньше). Без поднятого кагуне - 10-20% от физики (если здоровье не меньше), от кагуне - 0%.

    ♦️ Влияние типов кагуне на статы (множитель к соответствующему стату):

    🔸 Укаку: скорость ×1.8
    🔸 Коукаку: сила ×1.6, скорость ×1.3
    🔸 Ринкаку: ловкость ×1.3, регенерация ×1.8, скорость ×1.5, здоровье ×1.5
    🔸 Бикаку: сила ×1.5, ловкость ×1.4, регенерация ×1.4, скорость ×1.4, здоровье ×1.4

    Если открыто несколько типов, трогающих один стат - побеждает "хозяин" стата, иначе применяется наименьший из множителей.

    Сила кагуне (сумма силы всех открытых типов) сама по себе НЕ множится типом кагуне - только голодом и какуджей.
  upgrade:
    done: |-
      ✅ Ты успешно усилил свое кагуне.

      💪 Его текущий уровень: {kagune_strength}.
      💲 Денег затрачено: {money}

      ⌛️ Следующая попытка через 10 минут.
    cooldown: Вышел нахуй отсюда еблан тупорылый. И не заходи ещё {minutes} минут и {seconds} секунд
snap:
  done: |-
    ☑️ Пальчик успешно сломан

    🫰Всего сломано пальцев: {count}.
    💸 CheSton получено: {money}.

    🕰 Следующая попытка через 10 минут.
  cooldown: |-
    А вот нихуя не щелк. Пальцы еще не перезарядились.

     Осталось ждать ещё {minutes} минут и {seconds} секунд.
coffee:
  done: |-
    ☕️ Ты выпил чашечку кофе.

    💵 Деняк получено: {money}
    🔍 Всего выпито кофе: {count}

    🕰 Следующую чашку советуем пить не менее чем через 30 минут.
  cooldown: Ты тупой сын шлюхи получил передозировку кофе. Ты не сможешь пить кофе еще {hours} часов, {minutes} минут и {seconds} секунд
  snap_limit: Бесплатное кофе не дают бездарям. У тебя еще нет сотни сломанных пальцев, чтобы пить кофе.
eat_human:
  done: |-
    🍽 Ты сожрал человека.

    🍖 Голод восстановлен на {restored}%, теперь: {hunger}%
    🥩 Всего съедено людей: {count}
  cooldown: А не дохуя ли ты у нас жрать собрался? Попробуй через {hours} часов, {minutes} минут и {seconds} секунд
status:
  regen: |-
    ❤️ Здоровье: {health}/{max_health}
    ⚡ Скорость регенерации сейчас: {hp_per_hour} HP/ч
    🕰 {time_left}
  hunger: |-
    🍖 Голод: {hunger}% ({tier})
    🕰 {time_left}

    📉 Падающие статы (ловкость/скорость/регенерация/здоровье) сейчас: ×{falling_multiplier}
    📈 Растущие статы (сила/кагуне) сейчас: ×{rising_multiplier}

    ⚡ Эффективные статы прямо сейчас:
    🤟 Сила: {effective_strength}
    🤾‍♀️ Ловкость: {effective_dexterity}
    🏃 Скорость: {effective_speed}
    ❤️ Здоровье: {effective_health}
    ❣️ Регенерация: {effective_regeneration}
    ♦️ Кагуне: {effective_kagune_strength}
combat_power:
  full: |-
    ⚡ Боевая мощь гуля {danger_rank} ранга {name}

    🤟 Сила: {vacuum_strength} → {effective_strength}
    🤾‍♀️ Ловкость: {vacuum_dexterity} → {effective_dexterity}
    🏃 Скорость: {vacuum_speed} → {effective_speed}
    ❤️ Здоровье: {vacuum_health} → {effective_health}
    ❣️ Регенерация: {vacuum_regeneration} → {effective_regeneration}
    ♦️ Кагуне: {vacuum_kagune} → {effective_kagune}

    📊 Итого: {vacuum_power} → {effective_power}

    Самое правое значение - то, что реально используется в бою.
    Если надо узнать как голод влияет на статистики, напиши "голод".
    Если надо узнать как кагуне влияет на статистики, используй /kagune.
  short: |-
    Твоя боевая мощь вне боя: {vacuum_power}
    Твоя боевая мощь в бою: {effective_power}
fight:
  not_ready: 'Ты небоеспособен: {health} HP (нужно минимум {threshold}). Дай себе время восстановиться.'
  summary: |-
    ⚔️ Бой

    {rank_line_a}
    VS
    {rank_line_b}

    {winner_line}
    {loser_line}
    {hp_line_a}
    {hp_line_b}
    📜 Раундов: {rounds}
notify:
  level_up: |-
    🎉 Новый уровень: {level}!

    💰 CheSton получено: {cheston}
    ♦️ RC-клеток получено: {rc}

    📈 Пределы прокачки статов сдвинуты:
    {stat_changes}
  health_full: ❤️ Ты полностью восстановил здоровье! Можно дальше драца со всеми подряд
  hunger: 🍖 Голод гуля опустился до {threshold}%. Не забывай хавать, а то сдохнешь
  death: |-
    💀 Поздравляю, ты {cause}.

    📈 Уровень на момент смерти: {level}
    ♦️ RC-клеток заработано за жизнь: {lifetime_rc_earned}

    Следи за голодом и не лезь в драки с кем попало - в следующий раз повезёт больше.

    Чтобы начать заново - напиши "растить кагуне".
