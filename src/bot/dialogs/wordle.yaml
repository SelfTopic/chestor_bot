wordle:
  new_game: |-
    🟩 <b>Новая игра!</b>

    Угадайте слово из 5 букв за 6 попыток.
    🟩 — буква на своём месте
    🟨 — буква есть, но не там
    ⬛ — буквы нет в слове
  resume: |-
    У вас есть незавершённая игра.
    Введите слово из 5 букв чтобы продолжить.
  guess:
    won: |-
      🎉 Вы угадали слово <b>{word}</b> за {attempts} {attempts_word}!
      {board}
    lost: |-
      😔 Попытки закончились.
      Загаданное слово: <b>{word}</b>
    miss: |-
      {board}
      Слово <b>{word}</b> — не то.
      Попытка {used} из {max_attempts}, осталось {left}
  win: |-
    🎉 Поздравляем! Слово {word} угадано за {attempts} {attempts_word}!

    Заработано {award} CheSton's
    Сыграть ещё: /wordle{wiki}
  lose: |-
    😔 Не получилось. Загаданное слово: {word}
    Попробовать ещё раз: /wordle{wiki}
  # подставляется в {wiki} выше, поэтому начинается с пустой строки
  wiki_extract: "\n\n📖 {extract}"
  errors:
    wrong_length: 'Ошибка: Слово должно содержать {length} букв.'
    not_russian: 'Ошибка: Используйте только русские буквы.'
