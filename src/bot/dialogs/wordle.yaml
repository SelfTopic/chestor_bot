wordle:
  new_game: |-
    🟩 <b>Новая игра!</b>

    Угадай слово из 5 букв за 6 попыток.
    🟩 — буква на своём месте
    🟨 — буква есть, но не там
    ⬛ — буквы нет в слове
  resume: |-
    У тебя уже есть незавершённая игра.
    Вводи слово из 5 букв, чтобы продолжить.
  guess:
    won: |-
      🎉 Угадал слово <b>{word}</b> за {attempts} {attempts_word}!
      {board}
    lost:
      - |-
        😔 Попытки закончились.
        Загаданное слово: <b>{word}</b>
      - |-
        😔 Всё, слился.
        Загаданное слово: <b>{word}</b>
    miss:
      - |-
        {board}
        Слово <b>{word}</b> — не то.
        Попытка {used} из {max_attempts}, осталось {left}
      - |-
        {board}
        <b>{word}</b>? Мимо, гений.
        Попытка {used} из {max_attempts}, осталось {left}
      - |-
        {board}
        <b>{word}</b> — хуйня, думай ещё.
        Попытка {used} из {max_attempts}, осталось {left}
  win:
    - |-
      🎉 Поздравляю! Слово {word} угадано за {attempts} {attempts_word}!

      💸 CheSton: +{award}
      Сыграть ещё: /wordle{wiki}
    - |-
      🎉 Ебать ты умный. Слово {word} — за {attempts} {attempts_word}!

      💸 CheSton: +{award}
      Сыграть ещё: /wordle{wiki}
  lose:
    - |-
      😔 Не получилось. Загаданное слово: {word}
      Попробовать ещё раз: /wordle{wiki}
    - |-
      😔 Слабак. Загаданное слово: {word}
      Реванш: /wordle{wiki}
  # подставляется в {wiki} выше, поэтому начинается с пустой строки
  wiki_extract: "\n\n📖 {extract}"
  errors:
    wrong_length: 'Ошибка: Слово должно быть из {length} букв. Считать умеешь?'
    not_russian: 'Ошибка: Только русские буквы, иностранный агент.'
