[project]
name = "bot"
version = "1.0.0"
description = "Telegram bot"
authors = [
    { name = "SelfTopic", email = "chestor.official@gmail.com" }
]

license = {text = "MIT"}
packages = [
    { include = "src", from = "." }
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiogram (>=3.31.0,<4.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "dependency-injector (>=4.48.1,<5.0.0)",
    "psycopg (>=3.2.9,<4.0.0)",
    "psycopg-c (>=3.2.9,<4.0.0)",
    "colorlog (>=6.9.0,<7.0.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "ghoul-quiz-lib @ git+https://github.com/SelfTopic/questions_ghoul_api_lib.git",
    "numpy (>=2.4.2,<3.0.0)",
    "moviepy (>=2.2.1,<3.0.0)",
    "pyrogram (>=2.0.106,<3.0.0)",
    "tgcrypto (>=1.2.5,<2.0.0)",
    "ffmpeg-python (>=0.2.0,<0.3.0)",
    "aiohttp (>=3.9.0,<3.13)",
    "pyyaml (>=6.0.3,<7.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.10,<0.15.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "docker (>=7.2.0,<8.0.0)"
]

[tool.ruff.lint.isort]
known-first-party = ["src"]